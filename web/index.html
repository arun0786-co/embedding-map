<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embedding map</title>
<style>
  :root { --bg: #0b0d12; --fg: #e8e8e8; --dim: #8a8f98; --panel: rgba(16, 19, 26, 0.88); --line: #262b35; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #gl, #labels { position: fixed; inset: 0; width: 100%; height: 100%; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  #side { top: 12px; left: 12px; width: 250px; max-height: calc(100% - 48px); overflow: auto; }
  #side h1 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  #side .sub { color: var(--dim); margin-bottom: 10px; }
  .cat { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; user-select: none; }
  .cat.off { opacity: 0.35; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .cat .n { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  #years { margin: 10px 0 4px; display: flex; align-items: center; gap: 8px; }
  #years input { flex: 1; }
  button { background: #1d222c; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #tip { pointer-events: none; display: none; max-width: 360px; font-size: 12px; }
  #tip .meta { color: var(--dim); margin-top: 2px; }
  #stats { bottom: 12px; right: 12px; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #err { top: 40%; left: 50%; transform: translate(-50%, -50%); display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="labels"></canvas>
<div id="side" class="panel">
  <h1 id="title">embedding map</h1>
  <div class="sub" id="subtitle">loading…</div>
  <div id="years"><button id="play">play</button><input id="year" type="range"><span id="yearv"></span></div>
  <div id="cats"></div>
</div>
<div id="tip" class="panel"></div>
<div id="stats" class="panel"></div>
<div id="err" class="panel"></div>
<script type="module" src="atlas.js"></script>
</body>
</html>
